<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Album System{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
      * {
        font-family: "Inter", sans-serif;
      }

      .nav-item {
        transition: all 0.3s;
      }
      .nav-item.active {
        background: rgba(99, 102, 241, 0.2);
        color: #6366f1;
      }
      .nav-item:hover {
        background: rgba(99, 102, 241, 0.1);
      }

      .btn-hover {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .btn-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      }

      .card-hover {
        transition: all 0.5s ease;
      }
      .card-hover:hover {
        transform: scale(1.02);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }

      #loading-overlay {
        backdrop-filter: blur(12px);
      }

      @keyframes pulse-ring {
        0%,
        100% {
          transform: scale(0.95);
          opacity: 1;
        }
        50% {
          transform: scale(1);
          opacity: 0.7;
        }
      }
      .pulse-ring {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <!-- Loading Overlay - FIXED -->
    <div id="loading-overlay" class="hidden fixed inset-0 bg-slate-900/40 z-50 flex flex-col items-center justify-center">
      <div class="relative">
        <div class="w-24 h-24 border-8 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
        <svg class="absolute inset-0 m-auto w-12 h-12 text-indigo-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
          ></path>
        </svg>
      </div>
      <p id="loading-text" class="mt-6 text-white font-black text-2xl tracking-tight">Đang xử lý...</p>
      <p id="loading-subtext" class="text-slate-300 mt-2 text-sm"></p>
    </div>

    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar Navigation -->
      <nav class="w-20 lg:w-64 bg-slate-900 text-white flex flex-col border-r border-slate-800 shadow-xl">
        <div class="p-6 flex items-center space-x-3">
          <div class="bg-indigo-500 p-2 rounded-xl shadow-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"
              ></path>
            </svg>
          </div>
          <h1 class="text-xl font-bold hidden lg:block tracking-tight">Your <span class="text-indigo-400">Album !!</span></h1>
        </div>

        <div class="flex-1 mt-6 space-y-1 px-3">
          <a href="/" class="nav-item w-full flex items-center space-x-4 px-5 py-4 rounded-2xl {% if request.endpoint == 'library' %}active{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"></path>
            </svg>
            <span class="hidden lg:block text-sm tracking-wide">Thư viện</span>
          </a>

          <a href="/query" class="nav-item w-full flex items-center space-x-4 px-5 py-4 rounded-2xl {% if request.endpoint == 'query' %}active{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span class="hidden lg:block text-sm tracking-wide">Truy vấn Ảnh</span>
          </a>

          <a href="/compare" class="nav-item w-full flex items-center space-x-4 px-5 py-4 rounded-2xl {% if request.endpoint == 'compare' %}active{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 4H5a2 2 0 00-2 2v14a2 2 0 002 2h4m10-2h4a2 2 0 002-2V6a2 2 0 00-2-2h-4M9 20V4"></path>
            </svg>
            <span class="hidden lg:block text-sm tracking-wide">So sánh</span>
          </a>

          <a href="/cleanup" class="nav-item w-full flex items-center space-x-4 px-5 py-4 rounded-2xl {% if request.endpoint == 'cleanup' %}active{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
              ></path>
            </svg>
            <span class="hidden lg:block text-sm tracking-wide">Dọn dẹp</span>
          </a>

          <a href="/editor" class="nav-item w-full flex items-center space-x-4 px-5 py-4 rounded-2xl {% if request.endpoint == 'editor' %}active{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              ></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span class="hidden lg:block text-sm tracking-wide">Chỉnh sửa</span>
          </a>
        </div>

        <div class="p-4 m-3 bg-slate-800/50 rounded-2xl hidden lg:block border border-slate-700">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Trạng thái Index</p>
          <div class="flex justify-between items-center text-sm">
            <span class="font-bold" id="library-count">{{ image_count }} ảnh</span>
            <div class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse pulse-ring"></div>
          </div>
        </div>
      </nav>

      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto p-6 lg:p-10">{% block content %}{% endblock %}</main>
    </div>

    <script>
      // ✅ FIXED: Nhận tham số text và subtext
      function showLoading(text = "Đang xử lý...", subtext = "") {
        const overlay = document.getElementById("loading-overlay");
        const textEl = document.getElementById("loading-text");
        const subtextEl = document.getElementById("loading-subtext");
        
        textEl.textContent = text;
        subtextEl.textContent = subtext;
        overlay.classList.remove("hidden");
      }

      function hideLoading() {
        document.getElementById("loading-overlay").classList.add("hidden");
      }
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
